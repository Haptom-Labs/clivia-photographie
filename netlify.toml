[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# === Redirects 301 — anciennes routes /projets/[slug]/ vers nouveaux hubs agences ===
[[redirects]]
  from = "/projets/agence-dame"
  to = "/agences/agence-dame"
  status = 301
  force = true

[[redirects]]
  from = "/projets/agence-dame/*"
  to = "/agences/agence-dame"
  status = 301
  force = true

[[redirects]]
  from = "/projets/brochetrose-architecture"
  to = "/agences/brochet-rose"
  status = 301
  force = true

[[redirects]]
  from = "/projets/brochetrose-architecture/*"
  to = "/agences/brochet-rose"
  status = 301
  force = true

[[redirects]]
  from = "/projets/florentine-du-chazaud"
  to = "/agences/florentine-du-chazaud"
  status = 301
  force = true

[[redirects]]
  from = "/projets/florentine-du-chazaud/*"
  to = "/agences/florentine-du-chazaud"
  status = 301
  force = true

[[redirects]]
  from = "/projets/dgot"
  to = "/agences/dgot"
  status = 301
  force = true

[[redirects]]
  from = "/projets/dgot/*"
  to = "/agences/dgot"
  status = 301
  force = true

# Cache long terme pour les assets buildés (hashés)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache long terme pour les images du portfolio
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache court pour le HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap + favicon
[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
